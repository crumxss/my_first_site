<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мой первый сайт - Контакты</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>

  <header>
    <h1 class="title">Мой первый сайт</h1>
    <nav>
      <a href="index.html">Главная</a>
      <a href="about.html">О проекте</a>
      <a href="contacts.html" class="active">Контакты</a>
      <button id="theme" class="btn btn-light btn-sm">Тёмная тема</button>
    </nav>
  </header>

  <main>
    <section class="card" id="contacts">
      <h2>Контакты</h2>
      <ul>
        <li>Почта: <a href="mailto:myemail@mail.ru">myemail@mail.ru</a></li>
        <li>GitHub: <a href="https://github.com/crumxss">crumxss</a></li>
      </ul>
    </section>

    <section class="card">
      <h2>Обратная связь</h2>
      <form id="contactForm">
        <div class="mb-3">
          <input id="name" type="text" class="form-control" placeholder="Имя">
        </div>
        <div class="mb-3">
          <input id="email" type="text" class="form-control" placeholder="Email">
        </div>
        <div class="mb-3">
          <textarea id="comment" class="form-control" rows="3" placeholder="Сообщение"></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Отправить</button>
      </form>
      <p id="formMessage" class="mt-3 mb-0"></p>
    </section>

  </main>

  <footer>
    <p>&copy; 2026 Мой первый сайт</p>
  </footer>

</body>
</html>
